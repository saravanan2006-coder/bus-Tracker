name: bus_tracker
description: BusTracker - live village-to-village bus tracking for Tamil Nadu.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking / state
  http: ^1.3.0
  provider: ^6.1.2
  web_socket_channel: ^3.0.2

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location & background service
  geolocator: ^13.0.2
  flutter_foreground_task: ^8.15.0

  # Storage / identifiers
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
