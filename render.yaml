services:
  - type: web
    name: bustracker-api
    runtime: docker
    repo: https://github.com/saravanan2006-coder/bus-Tracker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    preDeployCommand: python -m scripts.migrate
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DEBUG
        value: "false"
      - key: USE_POSTGIS
        value: "true"
      - key: REDIS_ENABLED
        value: "true"
      - key: SMS_PROVIDER
        value: console
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
