# Local production-like stack for BusTracker: PostgreSQL (with PostGIS) + Redis.
#
# Usage:
#   docker compose up -d
#   cd backend && TEST_DATABASE_URL=postgresql+asyncpg://bustracker:bustracker@localhost:5432/bustracker_test python -m pytest
#
# The prod schema (migrations/001_initial.sql) is applied automatically on a
# fresh Postgres volume; the app's own create_all is a no-op on top of it, so
# this mirrors the production bootstrap exactly.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: bustracker
      POSTGRES_PASSWORD: bustracker
      POSTGRES_DB: bustracker_test
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bustracker -d bustracker_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
